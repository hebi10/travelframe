name: Stage 15 one-time Expo compression lock sync (remove before merge)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "package.json"
      - ".github/workflows/stage15-one-time-app-lock-sync.yml"

permissions:
  contents: read

jobs:
  sync-app-lockfile:
    if: github.repository == 'hebi10/travelframe' && github.head_ref == 'fix/stage15-expo-compression-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage15-expo-compression-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Re-resolve only package lock without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Verify compression patch, current Expo and React Native versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.overrides.compression !== '1.8.2' || lock.packages['node_modules/compression']?.version !== '1.8.2')
            throw Error('Compression patch was not resolved');
          if (lock.packages['node_modules/expo']?.version !== '55.0.26' ||
              lock.packages['node_modules/expo-router']?.version !== '55.0.14' ||
              lock.packages['node_modules/react-native']?.version !== '0.83.6')
            throw Error('Unexpected Expo/React Native platform change; abort');
          console.log('Only patched Expo CLI compression locked; no release deployment');
          NODE
      - name: Commit lockfile only to exact authorized branch
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Already patched'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(lock): resolve compression security patch'
          git push origin HEAD:refs/heads/fix/stage15-expo-compression-20261106
