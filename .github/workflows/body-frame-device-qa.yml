name: Body Frame native device QA

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'features/**'
      - 'lib/**'
      - 'plugins/**'
      - 'assets/**'
      - 'constants/**'
      - 'types/**'
      - 'hooks/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.*'
      - 'babel.config.*'
      - 'metro.config.*'
      - 'tsconfig.json'
      - '.npmrc'
      - 'scripts/**'
      - '!scripts/verify-android-qa-apk.py'
      - '!scripts/test_verify_android_qa_apk.py'
      - '!scripts/android-qa-apk-selection.json'
      - '.github/workflows/body-frame-device-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: body-frame-device-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Generate Android project
        run: npm run android:prebuild:ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure standalone release host with disposable QA debugging
        run: |
          python3 - <<'PYQA'
          from pathlib import Path
          import re
          launcher = Path('node_modules/expo-dev-launcher/android')
          delegates = [launcher/'src/disableInRelease/java/expo/modules/devlauncher/DevLauncherPackageDelegate.kt', launcher/'src/release/java/expo/modules/devlauncher/DevLauncherPackageDelegate.kt']
          contracts = ['createApplicationLifecycleListeners', 'createReactActivityHandlers', 'createReactNativeHostHandlers']
          inert = next((path for path in delegates if path.exists() and all(re.search(r'fun\s+' + name + r'\([^)]*\)\s*:\s*List<[^>]+>\s*=\s*emptyList\(\)', path.read_text()) for name in contracts)), None)
          if inert is None:
              raise SystemExit('Installed DevLauncher has no verified inert release delegate')
          factory = Path('node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt')
          if not factory.exists() or 'useDevSupport: Boolean' not in factory.read_text():
              raise SystemExit('Installed Expo host contract does not expose useDevSupport')
          apps = list(Path('android/app/src/main/java').rglob('MainApplication.kt'))
          if len(apps) != 1 or 'ExpoReactHostFactory.getDefaultReactHost(' not in apps[0].read_text():
              raise SystemExit('Generated application does not match the verified Expo55 host contract')
          app = apps[0]
          app.write_text(app.read_text().replace('ExpoReactHostFactory.getDefaultReactHost(', 'ExpoReactHostFactory.getDefaultReactHost(\n      useDevSupport = false,', 1))
          gradle = Path('android/app/build.gradle')
          gradle.write_text(gradle.read_text() + '\nandroid { buildTypes { qaRelease { initWith release; debuggable true; signingConfig signingConfigs.debug; matchingFallbacks = ["release"] } } }\n')
          print('QA variant selects release dependency source sets, embedded JS and developer support disabled; run-as enabled only for disposable emulator seeding')
          PYQA
      - name: Build x86_64 native APK
        env:
          NODE_ENV: production
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash android/gradlew -p android --no-daemon --build-cache --max-workers=2 --console=plain -Pexpo.devlauncher.configureInRelease=false -PreactNativeArchitectures=x86_64 :app:assembleQaRelease 2>&1 | tee artifacts/native-build.log
          unzip -Z1 android/app/build/outputs/apk/qaRelease/app-qaRelease.apk | grep -Fx 'assets/index.android.bundle'
      - name: Upload standalone APK independently of captures
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: android/app/build/outputs/apk/qaRelease/app-qaRelease.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-native-build-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  capture-devices:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Verify capture helper
        run: python3 scripts/test_capture_android_qa.py
      - name: Ensure native video inspection tools
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture genuine Android UI at mobile and tablet sizes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-android-qa.py --apk artifacts/apk/app-qaRelease.apk --output artifacts/native-qa
      - name: Upload screenshots and capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-native-device-qa-${{ github.run_id }}
          path: artifacts/native-qa/
          if-no-files-found: warn
          retention-days: 14

  stage13-design-captures:
    needs: build-apk
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feat/body-frame-design-stage13-') || startsWith(github.head_ref, 'feat/body-frame-design-stage14-') || startsWith(github.head_ref, 'feat/body-frame-design-stageA-') || startsWith(github.head_ref, 'feat/body-frame-design-stageB-') || startsWith(github.head_ref, 'feat/body-frame-design-stageC-') || startsWith(github.head_ref, 'feat/body-frame-design-stageD-') || startsWith(github.head_ref, 'feat/r3-frame-journal-') || startsWith(github.head_ref, 'fix/body-frame-stage13-')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        profile: [phone-360dp, phone-412dp, tablet-600dp, tablet-750dp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Check Stage 13 scripts and synthetic fixture
        run: |
          python3 -m py_compile scripts/capture-stage13-android.py
          python3 scripts/test_capture_android_qa.py
          python3 scripts/test_capture_stage13_qa.py
          python3 -m py_compile scripts/verify-frame-journal-c7.py
          python3 scripts/test_verify_frame_journal_c7.py
      - name: Install screenshot fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture page screenshots with automated-test Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-stage13-android.py --profile ${{ matrix.profile }} --apk artifacts/apk/app-qaRelease.apk --output artifacts/stage13
        env:
          C7_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save every screenshot, gallery, UI XML and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-stage13-${{ matrix.profile }}-${{ github.run_id }}
          path: artifacts/stage13/
          if-no-files-found: warn
          retention-days: 90

  c7-integrated-qa:
    needs: stage13-design-captures
    if: ${{ always() && startsWith(github.head_ref, 'feat/r3-frame-journal-camera-c7-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Android PNG, XML and manifests from all four widths
        uses: actions/download-artifact@v4
        with:
          pattern: body-frame-stage13-*-${{ github.run_id }}
          merge-multiple: true
          path: artifacts/c7-captures
      - name: Prepare FFmpeg for Android screenshot pixel verification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Inspect C7 PNG integrity, theme pixels and all 24 variant cells
        run: |
          command -v ffmpeg
          python3 scripts/test_verify_frame_journal_c7.py
          python3 scripts/verify-frame-journal-c7.py --root artifacts/c7-captures --output artifacts/c7-report
      - name: Preserve C7 consolidated PASS or FAIL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-c7-integrated-qa-${{ github.run_id }}
          path: artifacts/c7-report/
          if-no-files-found: warn
          retention-days: 90

  store-demo-captures:
    name: STORE-03-B verified Android demo-photo screenshots
    needs: build-apk
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/store-03b-demo-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Verify pinned demo assets and QA scripts
        run: |
          python3 -m py_compile scripts/capture-android-qa.py scripts/capture-stage13-android.py scripts/capture-store-demo-android.py
          python3 scripts/test_capture_store_demo_qa.py
      - name: Ensure FFmpeg for screenshot pixel checks and preview thumbnails
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            timeout 120s sudo apt-get -o Acquire::Retries=2 update
            timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Enable disposable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture real UI with offline demo-photo library
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-store-demo-android.py --apk artifacts/apk/app-qaRelease.apk --output artifacts/store-demo
        env:
          BODY_FRAME_STORE_DEMO_FIXTURES: '1'
          STORE_DEMO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Preserve real Android PNGs, UI XML, JSON and proof manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelframe-store-03b-android-demo-${{ github.run_id }}
          path: artifacts/store-demo/
          if-no-files-found: warn
          retention-days: 90

  ui-r00-captures:
    name: UI-R00 Android baseline · ${{ matrix.profile }}
    needs: build-apk
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/ui-r00-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        profile: [phone-360dp, phone-412dp, tablet-600dp, tablet-750dp]
    env:
      UI_R00_BASE_SHA: '9e6d84cad89b59ae34f0fe45b6117b843de731e9'
      UI_R00_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BODY_FRAME_STORE_DEMO_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Verify exact baseline app and isolated QA-only diffs
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${UI_R00_BASE_SHA}^{commit}"
          git diff --name-only "$UI_R00_BASE_SHA" HEAD > ui-r00-changed.txt
          if grep -Ev '^(scripts/(capture_ui_r00_baseline|ui_r00_data_fixtures|verify_ui_r00_baseline|test_ui_r00_baseline)\.py|tests/ui-r00-baseline\.test\.mjs|docs/design/ui-r00-baseline-20261111\.md|\.github/workflows/body-frame-device-qa\.yml)    needs: build-apk
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'feat/body-frame-design-stage6-') || startsWith(github.head_ref, 'fix/body-frame-stage7-'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Verify native screenshot helpers
        run: python3 scripts/test_capture_android_qa.py
      - name: Ensure synthetic fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture genuine 360/412/600/750dp light/dark and scaled-font Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-android-qa.py --scenario visual --apk artifacts/apk/app-qaRelease.apk --output artifacts/stage6-visual
      - name: Audit visual matrix completeness and Android evidence
        if: always()
        run: python3 scripts/check-stage6-visual-artifacts.py --output artifacts/stage6-visual
      - name: Preserve all visual captures and explicit failed scenarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-stage6-visual-qa-${{ github.run_id }}
          path: artifacts/stage6-visual/
          if-no-files-found: warn
          retention-days: 14
 ui-r00-changed.txt; then
            echo 'Client app source differs from the locked baseline; stop exact-head capture'
            exit 1
          fi
          python3 scripts/test_ui_r00_baseline.py
          python3 -m py_compile scripts/capture_ui_r00_baseline.py scripts/ui_r00_data_fixtures.py scripts/verify_ui_r00_baseline.py
      - name: Ensure native PNG decoding
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            timeout 120s sudo apt-get -o Acquire::Retries=2 update
            timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Enable disposable Android emulator KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture 10 real screens plus data state cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture_ui_r00_baseline.py --profile ${{ matrix.profile }} --apk artifacts/apk/app-qaRelease.apk --output artifacts/ui-r00
      - name: Preserve source-linked PNG, XML, metadata and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelframe-ui-r00-${{ matrix.profile }}-${{ github.run_id }}
          path: artifacts/ui-r00/
          if-no-files-found: warn
          retention-days: 90

  ui-r00-verify:
    name: UI-R00 integrated 100-image verification
    needs: [build-apk, ui-r00-captures]
    if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/ui-r00-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download genuine Android evidence from all four device profiles
        uses: actions/download-artifact@v4
        with:
          pattern: travelframe-ui-r00-*-${{ github.run_id }}
          merge-multiple: true
          path: artifacts/ui-r00
      - name: Verify all profile screenshots, states, XML and hashes
        run: |
          python3 scripts/test_ui_r00_baseline.py
          python3 scripts/verify_ui_r00_baseline.py --root artifacts/ui-r00 --output artifacts/ui-r00-report
      - name: Save complete or failing baseline audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelframe-ui-r00-final-verification-${{ github.run_id }}
          path: artifacts/ui-r00-report/
          if-no-files-found: warn
          retention-days: 90

  stage6-design-matrix:
    needs: build-apk
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'feat/body-frame-design-stage6-') || startsWith(github.head_ref, 'fix/body-frame-stage7-'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Verify native screenshot helpers
        run: python3 scripts/test_capture_android_qa.py
      - name: Ensure synthetic fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture genuine 360/412/600/750dp light/dark and scaled-font Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-android-qa.py --scenario visual --apk artifacts/apk/app-qaRelease.apk --output artifacts/stage6-visual
      - name: Audit visual matrix completeness and Android evidence
        if: always()
        run: python3 scripts/check-stage6-visual-artifacts.py --output artifacts/stage6-visual
      - name: Preserve all visual captures and explicit failed scenarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-stage6-visual-qa-${{ github.run_id }}
          path: artifacts/stage6-visual/
          if-no-files-found: warn
          retention-days: 14
