name: Body Frame native device QA

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'features/**'
      - 'lib/**'
      - 'plugins/**'
      - 'assets/**'
      - 'constants/**'
      - 'types/**'
      - 'hooks/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.*'
      - 'babel.config.*'
      - 'metro.config.*'
      - 'tsconfig.json'
      - '.npmrc'
      - 'scripts/**'
      - '!scripts/verify-android-qa-apk.py'
      - '!scripts/test_verify_android_qa_apk.py'
      - '!scripts/android-qa-apk-selection.json'
      - '.github/workflows/body-frame-device-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: body-frame-device-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: "!startsWith(github.head_ref, 'feat/r3-frame-journal-c0-')"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Generate Android project
        run: npm run android:prebuild:ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure standalone release host with disposable QA debugging
        run: |
          python3 - <<'PYQA'
          from pathlib import Path
          import re
          launcher = Path('node_modules/expo-dev-launcher/android')
          delegates = [launcher/'src/disableInRelease/java/expo/modules/devlauncher/DevLauncherPackageDelegate.kt', launcher/'src/release/java/expo/modules/devlauncher/DevLauncherPackageDelegate.kt']
          contracts = ['createApplicationLifecycleListeners', 'createReactActivityHandlers', 'createReactNativeHostHandlers']
          inert = next((path for path in delegates if path.exists() and all(re.search(r'fun\s+' + name + r'\([^)]*\)\s*:\s*List<[^>]+>\s*=\s*emptyList\(\)', path.read_text()) for name in contracts)), None)
          if inert is None:
              raise SystemExit('Installed DevLauncher has no verified inert release delegate')
          factory = Path('node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt')
          if not factory.exists() or 'useDevSupport: Boolean' not in factory.read_text():
              raise SystemExit('Installed Expo host contract does not expose useDevSupport')
          apps = list(Path('android/app/src/main/java').rglob('MainApplication.kt'))
          if len(apps) != 1 or 'ExpoReactHostFactory.getDefaultReactHost(' not in apps[0].read_text():
              raise SystemExit('Generated application does not match the verified Expo55 host contract')
          app = apps[0]
          app.write_text(app.read_text().replace('ExpoReactHostFactory.getDefaultReactHost(', 'ExpoReactHostFactory.getDefaultReactHost(\n      useDevSupport = false,', 1))
          gradle = Path('android/app/build.gradle')
          gradle.write_text(gradle.read_text() + '\nandroid { buildTypes { qaRelease { initWith release; debuggable true; signingConfig signingConfigs.debug; matchingFallbacks = ["release"] } } }\n')
          print('QA variant selects release dependency source sets, embedded JS and developer support disabled; run-as enabled only for disposable emulator seeding')
          PYQA
      - name: Build x86_64 native APK
        env:
          NODE_ENV: production
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash android/gradlew -p android --no-daemon --build-cache --max-workers=2 --console=plain -Pexpo.devlauncher.configureInRelease=false -PreactNativeArchitectures=x86_64 :app:assembleQaRelease 2>&1 | tee artifacts/native-build.log
          unzip -Z1 android/app/build/outputs/apk/qaRelease/app-qaRelease.apk | grep -Fx 'assets/index.android.bundle'
      - name: Upload standalone APK independently of captures
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: android/app/build/outputs/apk/qaRelease/app-qaRelease.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-native-build-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  capture-devices:
    needs: build-apk
    if: "!startsWith(github.head_ref, 'feat/r3-frame-journal-c0-')"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Verify capture helper
        run: python3 scripts/test_capture_android_qa.py
      - name: Ensure native video inspection tools
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture genuine Android UI at mobile and tablet sizes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-android-qa.py --apk artifacts/apk/app-qaRelease.apk --output artifacts/native-qa
      - name: Upload screenshots and capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-native-device-qa-${{ github.run_id }}
          path: artifacts/native-qa/
          if-no-files-found: warn
          retention-days: 14

  stage13-design-captures:
    needs: build-apk
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feat/body-frame-design-stage13-') || startsWith(github.head_ref, 'feat/body-frame-design-stage14-') || startsWith(github.head_ref, 'feat/body-frame-design-stageA-') || startsWith(github.head_ref, 'feat/body-frame-design-stageB-') || startsWith(github.head_ref, 'feat/body-frame-design-stageC-') || startsWith(github.head_ref, 'feat/body-frame-design-stageD-') || startsWith(github.head_ref, 'feat/r3-frame-journal-') || startsWith(github.head_ref, 'fix/body-frame-stage13-')) && !startsWith(github.head_ref, 'feat/r3-frame-journal-c0-')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        profile: [phone-360dp, phone-412dp, tablet-600dp, tablet-750dp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Check Stage 13 scripts and synthetic fixture
        run: |
          python3 -m py_compile scripts/capture-stage13-android.py
          python3 scripts/test_capture_android_qa.py
          python3 scripts/test_capture_stage13_qa.py
      - name: Install screenshot fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture page screenshots with automated-test Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-stage13-android.py --profile ${{ matrix.profile }} --apk artifacts/apk/app-qaRelease.apk --output artifacts/stage13
      - name: Save every screenshot, gallery, UI XML and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-stage13-${{ matrix.profile }}-${{ github.run_id }}
          path: artifacts/stage13/
          if-no-files-found: warn
          retention-days: 90

  camera-c0-baseline:
    name: C0 Camera Before · ${{ matrix.profile }}
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/r3-frame-journal-c0-')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        profile: [phone-360dp, phone-412dp, tablet-600dp, tablet-750dp]
    env:
      C0_APP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
          run-id: 42557776721
          github-token: ${{ github.token }}
      - name: Verify pinned C0 QA APK from successful same-source build
        run: |
          printf '%s  %s\n' 5a73debb0ceb30903f0f876bdc5c9784cf700031398dd5b1151cb0e13722ffb4 artifacts/apk/app-qaRelease.apk | sha256sum --check --status
          unzip -Z1 artifacts/apk/app-qaRelease.apk | grep -Fx 'assets/index.android.bundle'
      - name: Validate camera baseline capture script
        run: |
          python3 -m py_compile scripts/capture-camera-c0-android.py
          python3 scripts/test_capture_android_qa.py
          python3 scripts/test_capture_stage13_qa.py
      - name: Install screenshot fixture encoder if missing
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version | head -1
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture camera and every camera-linked UI state on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-camera-c0-android.py --profile ${{ matrix.profile }} --apk artifacts/apk/app-qaRelease.apk --output artifacts/camera-c0
      - name: Preserve Before PNG/XML/JSON, gallery, manifest and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-frame-camera-c0-${{ matrix.profile }}-${{ github.run_id }}
          path: artifacts/camera-c0/
          if-no-files-found: warn
          retention-days: 90

  stage6-design-matrix:
    needs: build-apk
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'feat/body-frame-design-stage6-') || startsWith(github.head_ref, 'fix/body-frame-stage7-'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Verify native screenshot helpers
        run: python3 scripts/test_capture_android_qa.py
      - name: Ensure synthetic fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture genuine 360/412/600/750dp light/dark and scaled-font Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/capture-android-qa.py --scenario visual --apk artifacts/apk/app-qaRelease.apk --output artifacts/stage6-visual
      - name: Audit visual matrix completeness and Android evidence
        if: always()
        run: python3 scripts/check-stage6-visual-artifacts.py --output artifacts/stage6-visual
      - name: Preserve all visual captures and explicit failed scenarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-stage6-visual-qa-${{ github.run_id }}
          path: artifacts/stage6-visual/
          if-no-files-found: warn
          retention-days: 14
