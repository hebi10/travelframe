    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: body-frame-native-qa-apk
          path: artifacts/apk
      - name: Validate offline synthetic MP4 QA scripts
        run: |
          python3 -m py_compile scripts/run_ui_r05_native_video.py scripts/verify_ui_r05_video_qa.py
          python3 scripts/test_capture_android_qa.py
      - name: Ensure FFmpeg/FFprobe and emulator KVM
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 120s sudo apt-get -o Acquire::Retries=2 update
            timeout 240s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android MP4, persistent library and cancel/error QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 scripts/run_ui_r05_native_video.py --apk artifacts/apk/app-qaRelease.apk --output artifacts/ui-r05-video
