name: Functions Lock Refresh

on:
  push:
    branches:
      - main
    paths:
      - "functions/package.json"
      - ".github/workflows/functions-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Resolve compatible Functions dependency tree
        working-directory: functions
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
          else
            git commit -m "Refresh Functions dependency lockfile"
            git push origin HEAD:main
          fi
