name: Stage 15 one-time Functions lockfile sync (remove before merge)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "functions/package.json"
      - ".github/workflows/stage15-one-time-lock-sync.yml"

permissions:
  contents: read

jobs:
  sync-functions-lockfile:
    if: github.repository == 'hebi10/travelframe' && github.head_ref == 'fix/stage15-functions-parser-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage15-functions-parser-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Update lockfile only without running untrusted install scripts
        run: npm install --package-lock-only --ignore-scripts --prefix functions --no-audit --no-fund
      - name: Verify exact intended parser/qs patches before committing
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('functions/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('functions/package-lock.json', 'utf8'));
          for (const [name, version] of Object.entries({ 'body-parser': '1.20.9', 'qs': '6.16.1' })) {
            if (pkg.overrides[name] !== version || lock.packages['node_modules/' + name]?.version !== version)
              throw new Error('Unexpected patched dependency version for ' + name);
          }
          console.log('Only locked patched parser versions verified; no publish, signing or deployment');
          NODE
      - name: Commit only the repaired Functions lockfile to the exact same-repo branch
        shell: bash
        run: |
          git add functions/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change needed'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(lock): resolve patched Functions body-parser and qs'
          git push origin HEAD:refs/heads/fix/stage15-functions-parser-20261106
