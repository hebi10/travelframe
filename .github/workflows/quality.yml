name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format / Lint
        run: npm run format:check

      - name: Prebuild Android
        run: npm run android:prebuild:ci

      - name: Release Source Verify
        run: npm run release:verify

      - name: Test
        run: npm test

      - name: Secret Scan
        run: npm run security:secrets

  functions:
    name: Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Verify Functions syntax
        run: npm run quality:functions

  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.18.0

      - name: Test Firebase Rules
        run: npm run test:firebase-rules

  android-kotlin:
    name: Android Gradle and Release Manifest Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npm run android:prebuild:ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Android Release Manifest
        working-directory: android
        timeout-minutes: 10
        run: ./gradlew --no-daemon --build-cache --parallel --max-workers=2 --console=plain :app:processReleaseMainManifest

      - name: Verify Android Kotlin
        working-directory: android
        timeout-minutes: 20
        run: ./gradlew --no-daemon --build-cache --parallel --max-workers=2 --console=plain -Pkotlin.compiler.execution.strategy=in-process -PreactNativeArchitectures=x86_64 :app:compileDebugKotlin
