name: Temporary Stage 19 Functions SDK lock verification

on:
  pull_request:
    paths:
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'scripts/validate-functions-v7-exports.cjs'
      - '.github/workflows/stage19-functions-sdk-lock.yml'

permissions:
  contents: write

concurrency:
  group: stage19-functions-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lock-and-runtime:
    if: github.repository == 'hebi10/travelframe' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/stage19-admin14-functions7-compat-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact same-repo candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate Functions-only npm lock without lifecycle scripts
        run: npm install --prefix functions --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install pinned Functions dependencies
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Verify real Admin 14 / Functions 7 boot and exports with no cloud credentials
        run: npm --prefix functions run quality
      - name: Collect advisory evidence
        if: always()
        run: npm audit --prefix functions --omit=dev --json > functions-stage19-prod-audit.json || true
      - name: Archive exact lock and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage19-functions-lock-and-audit
          path: |
            functions/package-lock.json
            functions-stage19-prod-audit.json
          retention-days: 14
      - name: Commit regenerated lock to this feature branch only
        if: success()
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = "security/stage19-admin14-functions7-compat-20261108"
          if ! git diff --quiet -- functions/package-lock.json; then
            git add -- functions/package-lock.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(functions): lock Admin14 and Functions7 validated dependency graph"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
