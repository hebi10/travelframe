name: Stage 15 one-time node-forge lockfile repair (remove before merge)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "package.json"
      - ".github/workflows/stage15-one-time-forge-lock.yml"

permissions:
  contents: read

jobs:
  sync-lockfile:
    if: github.repository == 'hebi10/travelframe' && github.head_ref == 'fix/stage15-nodeforge-compat-security-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage15-nodeforge-compat-security-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh lockfile only, without dependency lifecycle hooks
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Guard current Expo and patched security versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [name, version] of Object.entries({ 'node-forge': '1.4.3', compression: '1.8.2' })) {
            if (pkg.overrides[name] !== version || lock.packages['node_modules/' + name]?.version !== version) {
              throw new Error('Expected exact patched dependency: ' + name);
            }
          }
          for (const [name, version] of Object.entries({ expo: '55.0.26', 'expo-router': '55.0.14', 'react-native': '0.83.6' })) {
            if (lock.packages['node_modules/' + name]?.version !== version)
              throw new Error('Unexpected platform version change for ' + name);
          }
          console.log('Safe patched Forge lock; no app or Play release triggered');
          NODE
      - name: Commit only locked dependency updates to this same-repo branch
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change necessary'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(lock): lock patched node-forge'
          git push origin HEAD:refs/heads/fix/stage15-nodeforge-compat-security-20261106
