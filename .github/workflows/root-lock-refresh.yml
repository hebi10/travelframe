name: Root Lock Refresh

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/root-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
          else
            git commit -m "Refresh root dependency lockfile"
            git push origin HEAD:main
          fi
