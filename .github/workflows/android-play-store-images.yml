name: TravelFrame Play Store screenshots

run-name: TravelFrame store images ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'push-gate' }} · ko-KR phone · ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - '.github/workflows/android-play-store-images.yml'
      - 'docs/release-assets/play-phone-six-20261109.json'
      - 'assets/play-store/2026-11-09/**'
      - 'scripts/publish-play-store-images.mjs'
      - 'scripts/prepare-play-store-images.py'
      - 'tests/play-store-images.test.mjs'
  workflow_dispatch:
    inputs:
      ops06_store_approved:
        description: 'Approve store metadata change separately after final QA'
        type: boolean
        required: true
        default: false
      ops06_confirmation:
        description: 'For publish type APPLY_VERIFIED_PLAY_STORE_ASSETS'
        type: string
        required: false
      ops06_expected_main_sha:
        description: 'Exact approved 40-char current main SHA'
        type: string
        required: false
      ops06_batch_id:
        description: 'KST release batch YYYY-MM-DD-travelframe'
        type: string
        required: false
      ops01_release_approved:
        description: 'Manual Play upload approval after planned work and final QA'
        type: boolean
        required: true
        default: false
      mode:
        description: Inspect-only build or publish the exactly reviewed six Korean phone screenshots
        required: true
        default: check
        type: choice
        options: [check, publish]

permissions:
  contents: read

concurrency:
  group: travelframe-play-store-screenshots
  cancel-in-progress: false

jobs:
  validate:
    name: Validate screenshot manifest and transactional Publisher guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact six-image scope, digest guards, mock Play transaction
        run: node --test tests/play-store-images.test.mjs
      - name: Compile image processor
        run: python3 -m py_compile scripts/prepare-play-store-images.py

  archive:
    name: Package verified ko-KR phone screenshots for download
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      STORE_MANIFEST: ${{ github.workspace }}/docs/release-assets/play-phone-six-20261109.json
      STORE_EMBEDDED_DIR: ${{ github.workspace }}/assets/play-store/2026-11-09
      STORE_INPUT_DIR: ${{ github.workspace }}/.store-screenshot-input
      STORE_OUTPUT_DIR: ${{ github.workspace }}/.store-screenshot-output
    steps:
      - name: Checkout approved six-image source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original source SHA-256 digests
        run: node scripts/publish-play-store-images.mjs download-bundled
      - name: Install pinned Pillow dependency
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/store-archive-venv"
          "$RUNNER_TEMP/store-archive-venv/bin/pip" install --disable-pip-version-check Pillow==12.0.0
      - name: Prepare and validate six 1080x1920 RGB PNGs
        shell: bash
        run: |
          "$RUNNER_TEMP/store-archive-venv/bin/python" scripts/prepare-play-store-images.py \
            --manifest "$STORE_MANIFEST" \
            --source-dir "$STORE_INPUT_DIR" \
            --output-dir "$STORE_OUTPUT_DIR"
          node scripts/publish-play-store-images.mjs verify
      - name: Archive six PNGs and checksum manifest without Play mutations
        uses: actions/upload-artifact@v4
        with:
          name: travelframe-ko-KR-phone-images-${{ github.run_id }}
          path: ${{ env.STORE_OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

  publish:
    name: Verify bundled screenshots and update Play ko-KR phone listing only
    needs: validate
    if: >-
      github.repository == 'hebi10/travelframe' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' &&
      inputs.ops01_release_approved == true && inputs.ops06_store_approved == true &&
      vars.BODY_FRAME_PLAY_SIGNING_APPROVED_20261107 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      STORE_MANIFEST: ${{ github.workspace }}/docs/release-assets/play-phone-six-20261109.json
      STORE_EMBEDDED_DIR: ${{ github.workspace }}/assets/play-store/2026-11-09
      STORE_INPUT_DIR: ${{ github.workspace }}/.store-screenshot-input
      STORE_OUTPUT_DIR: ${{ github.workspace }}/.store-screenshot-output
      STORE_RECEIPT_PATH: ${{ github.workspace }}/.store-play-receipt.json
    steps:
      - name: Checkout reviewed store listing pipeline
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and SHA-256 verify six immutable repository screenshot assets
        run: node scripts/publish-play-store-images.mjs download-bundled
      - name: Set up isolated Pillow image conversion
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/store-venv"
          "$RUNNER_TEMP/store-venv/bin/pip" install --disable-pip-version-check Pillow==12.0.0
      - name: Prepare verified 1080x1920 RGB PNGs from the reviewed originals
        shell: bash
        run: |
          "$RUNNER_TEMP/store-venv/bin/python" scripts/prepare-play-store-images.py \
            --manifest "$STORE_MANIFEST" \
            --source-dir "$STORE_INPUT_DIR" \
            --output-dir "$STORE_OUTPUT_DIR"
          node scripts/publish-play-store-images.mjs verify
      - name: OPS-06 enforce separate listing approval and exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          OPS06_STORE_APPROVED: ${{ inputs.ops06_store_approved }}
          OPS06_CONFIRMATION: ${{ inputs.ops06_confirmation }}
          OPS06_EXPECTED_MAIN_SHA: ${{ inputs.ops06_expected_main_sha }}
          OPS06_BATCH_ID: ${{ inputs.ops06_batch_id }}
        run: python3 scripts/ops06/store_gate.py apply
      - name: Get Google Play Publisher token for the existing release identity
        id: playauth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Commit only Korean phone screenshots and independently verify Play readback
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.playauth.outputs.access_token }}
        run: node scripts/publish-play-store-images.mjs publish
      - name: Preserve exact six screenshots and any Play commit/readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-frame-store-phone-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STORE_OUTPUT_DIR }}/
            ${{ env.STORE_RECEIPT_PATH }}
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
