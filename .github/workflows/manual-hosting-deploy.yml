name: Manual production Hosting deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEPLOY_COMPLETE_ADMIN_HOSTING to confirm the entire admin/ site is published'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-hosting
      url: https://travelframe-4e1fb.web.app/privacy
    env:
      DEPLOY_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit full-site confirmation
        shell: bash
        run: |
          if [ "$DEPLOY_CONFIRM" != 'DEPLOY_COMPLETE_ADMIN_HOSTING' ]; then
            echo 'Production hosting deployment not approved.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Hosting release inputs
        run: |
          node scripts/verify-hosting-release.mjs
          node --test tests/admob-app-ads-hosting.test.mjs tests/hosting-release-preflight.test.mjs
      - name: Authenticate to Firebase with deployment-only service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAVELFRAME }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.18.0
      - name: Deploy complete admin/ directory to Hosting only
        run: firebase deploy --only hosting --project travelframe-4e1fb --non-interactive
      - name: Verify public privacy, account removal and app-ads.txt
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/probe-public-hosting.mjs --require-verified; then
              exit 0
            fi
            sleep 6
          done
          echo 'Public Hosting verification failed after deployment.' >&2
          exit 1
      - name: Explain verification scope
        run: echo 'Hosting verified. AdMob or Play Console acceptance must be checked separately.'
